# BendemenMC Core - Daily Reward
# One claim per 24 hours for the entire server (not per player).
cooldown-seconds: 86400

# World names. Only these worlds receive border expansion.
worlds:
  overworld: world
  nether: world_nether

# Weighted chances. Total weight = 100 by default.
# Expansion is added to the WorldBorder diameter in each configured world.
rewards:
  common:
    display-name: '&cGeen Expansion'
    weight: 70
    expansion: 0
    material: 'GRAY_STAINED_GLASS_PANE'
  rare:
    display-name: '&a+1 Block Expansion'
    weight: 20
    expansion: 1
    material: 'LIME_STAINED_GLASS_PANE'
  epic:
    display-name: '&5+2 Block Expansion'
    weight: 8
    expansion: 2
    material: 'PURPLE_STAINED_GLASS_PANE'
  mythic:
    display-name: '&6+3 Block Expansion'
    weight: 2
    expansion: 3
    material: 'YELLOW_STAINED_GLASS_PANE'

gui:
  title: '&f&lBendemenMC &r&8| &6Daily Reward'
  claim-name: '&6&lCLAIM DAILY REWARD'
  claim-lore:
    - '&6Klik om de dagelijkse reward te openen.'
    - '&6Eén reward per 24 uur voor de hele server.'
  cooldown-name: '&6&lREWARD OP COOLDOWN'
  rolling-name: '&6&lDe randomizer draait...'

days-gui:
  title: '&f&lBendemenMC &r&8| &6Days Leaderboard'
